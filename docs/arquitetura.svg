<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#1557b0"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#e68a00"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00a86b"/>
      <stop offset="100%" style="stop-color:#007a4d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>
  <rect width="900" height="320" fill="none" stroke="#e2e8f0" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Arquitetura da Solução — Conecta Company</text>
  <line x1="200" y1="46" x2="700" y2="46" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── NODES ── -->

  <!-- Node 1: Cliente -->
  <g transform="translate(52, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="8" rx="10" fill="url(#nodeGrad1)"/>
    <rect x="0" y="4" width="100" height="4" fill="url(#nodeGrad1)"/>
    <!-- Browser icon -->
    <rect x="30" y="18" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <rect x="30" y="18" width="40" height="7" rx="3" fill="#1a73e8"/>
    <circle cx="34" cy="21.5" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="39" cy="21.5" r="1.5" fill="white" opacity="0.7"/>
    <rect x="33" y="29" width="34" height="2" rx="1" fill="#1a73e8" opacity="0.3"/>
    <rect x="33" y="33" width="24" height="2" rx="1" fill="#1a73e8" opacity="0.3"/>
    <text x="50" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Cliente</text>
    <text x="50" y="73" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Navegador</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="155" y1="170" x2="195" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="175" y="163" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">HTTPS</text>

  <!-- Node 2: S3 Website -->
  <g transform="translate(198, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="8" rx="10" fill="url(#nodeGrad2)"/>
    <rect x="0" y="4" width="110" height="4" fill="url(#nodeGrad2)"/>
    <!-- S3 bucket icon -->
    <ellipse cx="55" cy="26" rx="20" ry="7" fill="#fff3e0" stroke="#FF9900" stroke-width="1.5"/>
    <rect x="35" y="26" width="40" height="18" fill="#fff3e0" stroke="#FF9900" stroke-width="1.5"/>
    <ellipse cx="55" cy="44" rx="20" ry="7" fill="#ffe0b2" stroke="#FF9900" stroke-width="1.5"/>
    <text x="55" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">S3 Website</text>
    <text x="55" y="73" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Chat Widget</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="311" y1="170" x2="351" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="331" y="163" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">WSS</text>

  <!-- Node 3: Amazon Connect -->
  <g transform="translate(354, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="120" rx="10" fill="white" stroke="#FF9900" stroke-width="2"/>
    <rect x="0" y="0" width="130" height="8" rx="10" fill="url(#nodeGrad2)"/>
    <rect x="0" y="4" width="130" height="4" fill="url(#nodeGrad2)"/>
    <!-- Headset icon -->
    <g transform="translate(65, 42)">
      <path d="M-16,-12 Q-16,-28 0,-28 Q16,-28 16,-12 L16,-4 Q16,2 10,2 L7,2 L7,-12 Q7,-22 0,-22 Q-7,-22 -7,-12 L-7,2 L-10,2 Q-16,2 -16,-4 Z" fill="#FF9900" opacity="0.8"/>
      <rect x="-19" y="-6" width="8" height="14" rx="4" fill="#FF9900" opacity="0.8"/>
      <rect x="11" y="-6" width="8" height="14" rx="4" fill="#FF9900" opacity="0.8"/>
      <path d="M-7,10 Q-7,16 0,16 Q7,16 7,10" fill="none" stroke="#FF9900" stroke-width="2" opacity="0.8"/>
    </g>
    <text x="65" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Amazon</text>
    <text x="65" y="97" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Connect</text>
    <text x="65" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Contact Center</text>
  </g>

  <!-- Arrow 3→4 (Contact Flow - goes down) -->
  <line x1="419" y1="232" x2="419" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8">roteia</text>

  <!-- Node 4: Contact Flow -->
  <g transform="translate(354, 265)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="44" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="6" rx="8" fill="#7c3aed"/>
    <rect x="0" y="3" width="130" height="3" fill="#7c3aed"/>
    <text x="65" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Contact Flow</text>
    <text x="65" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Menu de Opções</text>
  </g>

  <!-- Arrow 3→5 -->
  <line x1="487" y1="170" x2="527" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="507" y="163" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">fila</text>

  <!-- Node 5: Agente CCP -->
  <g transform="translate(530, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="8" rx="10" fill="url(#nodeGrad3)"/>
    <rect x="0" y="4" width="110" height="4" fill="url(#nodeGrad3)"/>
    <!-- Agent icon -->
    <circle cx="55" cy="28" r="10" fill="#e8f5e9" stroke="#00a86b" stroke-width="1.5"/>
    <circle cx="55" cy="25" r="5" fill="#00a86b" opacity="0.7"/>
    <path d="M43,38 Q43,32 55,32 Q67,32 67,38" fill="#00a86b" opacity="0.5"/>
    <text x="55" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Agente</text>
    <text x="55" y="71" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">CCP</text>
  </g>

  <!-- Arrow 3→6 (Analytics - goes right-up) -->
  <line x1="487" y1="155" x2="527" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Node 6: Metrics -->
  <g transform="translate(530, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="60" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="6" rx="10" fill="#0ea5e9"/>
    <rect x="0" y="3" width="110" height="3" fill="#0ea5e9"/>
    <!-- Chart bars -->
    <rect x="25" y="20" width="8" height="20" rx="2" fill="#0ea5e9" opacity="0.4"/>
    <rect x="37" y="14" width="8" height="26" rx="2" fill="#0ea5e9" opacity="0.6"/>
    <rect x="49" y="18" width="8" height="22" rx="2" fill="#0ea5e9" opacity="0.8"/>
    <rect x="61" y="10" width="8" height="30" rx="2" fill="#0ea5e9"/>
    <rect x="73" y="16" width="8" height="24" rx="2" fill="#0ea5e9" opacity="0.7"/>
    <text x="55" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">Métricas</text>
  </g>

  <!-- Arrow 5→7 -->
  <line x1="643" y1="170" x2="683" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Node 7: Contact Records -->
  <g transform="translate(686, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="8" rx="10" fill="#f59e0b"/>
    <rect x="0" y="4" width="110" height="4" fill="#f59e0b"/>
    <!-- Document icon -->
    <rect x="35" y="16" width="40" height="34" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="40" y="22" width="30" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="40" y="27" width="24" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="40" y="32" width="28" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="40" y="37" width="20" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
    <text x="55" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Contact</text>
    <text x="55" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Records</text>
  </g>

  <!-- Step numbers -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700">
    <circle cx="175" cy="195" r="9" fill="#1a73e8" opacity="0.15"/>
    <text x="175" y="198" fill="#1a73e8" text-anchor="middle">①</text>

    <circle cx="331" cy="195" r="9" fill="#FF9900" opacity="0.15"/>
    <text x="331" y="198" fill="#FF9900" text-anchor="middle">②</text>

    <circle cx="507" cy="195" r="9" fill="#FF9900" opacity="0.15"/>
    <text x="507" y="198" fill="#FF9900" text-anchor="middle">③</text>

    <circle cx="663" cy="195" r="9" fill="#00a86b" opacity="0.15"/>
    <text x="663" y="198" fill="#00a86b" text-anchor="middle">④</text>
  </g>

  <!-- Legend -->
  <g transform="translate(52, 285)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8">① Acessa o site</text>
    <text x="100" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8">② Inicia chat via widget</text>
    <text x="240" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8">③ Roteado pelo Contact Flow</text>
    <text x="410" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8">④ Atendido pelo agente</text>
  </g>
</svg>
